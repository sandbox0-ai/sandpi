apiVersion: v1
kind: Service
metadata:
  name: sandpi
  labels:
    app.kubernetes.io/name: sandpi
    app.kubernetes.io/part-of: sandpi
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/name: sandpi
    app.kubernetes.io/part-of: sandpi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandpi
  labels:
    app.kubernetes.io/name: sandpi
    app.kubernetes.io/part-of: sandpi
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sandpi
      app.kubernetes.io/part-of: sandpi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandpi
        app.kubernetes.io/part-of: sandpi
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: sandpi-ghcr
      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 60
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - until pg_isready -h postgres -U sandpi -d sandpi; do sleep 2; done
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  key: POSTGRES_PASSWORD
                  name: sandpi-postgres
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 70
            runAsNonRoot: true
            runAsUser: 70
      containers:
        - name: sandpi
          image: ghcr.io/sandbox0-ai/sandpi:main
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: sandpi-runtime
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 90
            periodSeconds: 2
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      volumes:
        - name: tmp
          emptyDir: {}
