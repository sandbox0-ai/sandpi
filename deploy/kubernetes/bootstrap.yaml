apiVersion: v1
kind: Namespace
metadata:
  name: sandpi
  labels:
    app.kubernetes.io/part-of: sandpi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-deployer
  namespace: sandpi
  labels:
    app.kubernetes.io/part-of: sandpi
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: github-deployer-token
  namespace: sandpi
  annotations:
    kubernetes.io/service-account.name: github-deployer
type: kubernetes.io/service-account-token
---
apiVersion: v1
kind: Secret
metadata:
  name: sandpi-postgres
  namespace: sandpi
  labels:
    app.kubernetes.io/part-of: sandpi
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: sandpi-cloudflare
  namespace: sandpi
  labels:
    app.kubernetes.io/part-of: sandpi
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: sandpi-runtime
  namespace: sandpi
  labels:
    app.kubernetes.io/part-of: sandpi
type: Opaque
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-deployer
  namespace: sandpi
  labels:
    app.kubernetes.io/part-of: sandpi
rules:
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - pods
      - pods/log
      - events
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resourceNames:
      - sandpi-postgres
      - sandpi-cloudflare
      - sandpi-runtime
    resources:
      - secrets
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
      - statefulsets
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - networking.k8s.io
    resources:
      - ingresses
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - cert-manager.io
    resources:
      - certificates
      - issuers
    verbs:
      - create
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - cert-manager.io
    resources:
      - certificaterequests
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - acme.cert-manager.io
    resources:
      - challenges
      - orders
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-deployer
  namespace: sandpi
  labels:
    app.kubernetes.io/part-of: sandpi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-deployer
subjects:
  - kind: ServiceAccount
    name: github-deployer
    namespace: sandpi
