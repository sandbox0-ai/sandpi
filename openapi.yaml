                - occurredAt
              additionalProperties: false
          required:
            - type
          additionalProperties: false
    WorkspaceDirectoryListing:
      type: object
      properties:
        path:
          type: string
        entries:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceFile"
        refreshedAt:
          type: number
          description: Unix time in seconds; fractional values preserve milliseconds.
      required:
        - path
        - entries
        - refreshedAt
      additionalProperties: false
    WorkspaceFile:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        path:
          type: string
        kind:
          type: string
          enum:
            - file
            - folder
        language:
          type: string
        size:
          type: string
        modifiedAt:
          type: number
          description: Unix time in seconds; fractional values preserve milliseconds.
        content:
          type: string
        children:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceFile"
      required:
        - id
        - name
        - path
        - kind
      additionalProperties: false
    WorkspaceFileSearchResult:
      type: object
      properties:
        name:
          type: string
        path:
          type: string
        kind:
          type: string
          enum:
            - file
            - folder
      required:
        - name
        - path
        - kind
      additionalProperties: false
    WorkspaceGitState:
      type: object
      properties:
        repositories:
          type: array
          items:
            type: object
            properties:
              root:
                type: string
              branch:
                type: string
              head:
                type: string
              upstream:
                type: string
              ahead:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
              behind:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
              files:
                type: array
                items:
                  type: object
                  properties:
                    path:
                      type: string
                    relativePath:
                      type: string
                    originalPath:
                      type: string
                    kind:
                      type: string
                      enum:
                        - added
                        - modified
                        - deleted
                        - renamed
                        - copied
                        - untracked
                        - conflicted
                    indexStatus:
                      type: string
                    worktreeStatus:
                      type: string
                    staged:
                      type: boolean
                    unstaged:
                      type: boolean
                  required:
                    - path
                    - relativePath
                    - kind
                    - indexStatus
                    - worktreeStatus
                    - staged
                    - unstaged
                  additionalProperties: false
            required:
              - root
              - ahead
              - behind
              - files
            additionalProperties: false
      required:
        - repositories
      additionalProperties: false
    WorkspaceIdeEvent:
      oneOf:
        - type: object
          properties:
            type:
              type: string
              enum:
                - ready
            at:
              type: number
              description: Unix time in seconds; fractional values preserve milliseconds.
          required:
            - type
            - at
          additionalProperties: false
        - type: object
          properties:
            type:
              type: string
              enum:
                - change
            event:
              type: string
            path:
              type: string
            at:
              type: number
              description: Unix time in seconds; fractional values preserve milliseconds.
          required:
            - type
            - event
            - path
            - at
          additionalProperties: false
        - type: object
          properties:
            type:
              type: string
              enum:
                - error
            error:
              type: string
            code:
              type: string
              enum:
                - workspace_watch_unavailable
            at:
              type: number
              description: Unix time in seconds; fractional values preserve milliseconds.
          required:
            - type
            - error
            - at
          additionalProperties: false
    WorkspaceIdeFile:
      type: object
      properties:
        path:
          type: string
        name:
          type: string
        revision:
          type: string
        encoding:
          type: string
          enum:
            - base64
        content:
          type: string
        kind:
          type: string
          enum:
            - binary
            - text
        preview:
          type: object
          properties:
            kind:
              type: string
              enum:
                - audio
                - image
                - pdf
                - presentation
                - video
            mimeType:
              type: string
          required:
            - kind
            - mimeType
          additionalProperties: false
        bom:
          type: string
          enum:
            - utf8
        editable:
          type: boolean
        readOnlyReason:
          type: string
          enum:
            - binary
            - deleted
            - sandpi-managed
            - runtime-blocked
        size:
          type: string
        modifiedAt:
          type: number
          description: Unix time in seconds; fractional values preserve milliseconds.
        git:
          type: object
          properties:
            path:
              type: string
            relativePath:
              type: string
            originalPath:
              type: string
            kind:
              type: string
              enum:
                - added
                - modified
                - deleted
                - renamed
                - copied
                - untracked
                - conflicted
            indexStatus:
              type: string
            worktreeStatus:
              type: string
            staged:
              type: boolean
            unstaged:
              type: boolean
          required:
            - path
            - relativePath
            - kind
            - indexStatus
            - worktreeStatus
            - staged
            - unstaged
          additionalProperties: false
        lineChanges:
          type: array
          items:
            type: object
            properties:
              line:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
              kind:
                type: string
                enum:
                  - added
                  - modified
                  - deleted
              staged:
                type: boolean
              unstaged:
                type: boolean
              deletedLines:
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
              placement:
                type: string
                enum:
                  - before
                  - after
            required:
              - line
              - kind
              - staged
              - unstaged
            additionalProperties: false
      required:
        - path
        - name
        - revision
        - encoding
        - content
        - kind
        - editable
        - lineChanges
      additionalProperties: false
    WorkspaceIdeSnapshot:
      type: object
      properties:
        files:
          type: array
          items:
            $ref: "#/components/schemas/WorkspaceFile"
        git:
          $ref: "#/components/schemas/WorkspaceGitState"
        refreshedAt:
          type: number
          description: Unix time in seconds; fractional values preserve milliseconds.
      required:
        - files
        - git
        - refreshedAt
      additionalProperties: false
    WorkspaceIdeWatchSubscription:
      type: object
      properties:
        type:
          type: string
          enum:
            - subscribe
        paths:
          maxItems: 64
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 4096
      required:
        - type
        - paths
      additionalProperties: false
    WorkspaceRuntimeAccessMeta:
      oneOf:
        - type: object
          properties:
            runtimeAccess:
              type: string
              enum:
                - sandbox
          required:
            - runtimeAccess
          additionalProperties: false
        - type: object
          properties:
            runtimeAccess:
              type: string
              enum:
                - persistent-storage
            runtimeBlock:
              type: object
              properties:
                code:
                  type: string
                  enum:
                    - sandbox_runtime_quota_exhausted
                    - environment_plan_limit
                message:
                  type: string
                details:
                  type: object
                  additionalProperties: {}
              required:
                - code
                - message
              additionalProperties: false
          required:
            - runtimeAccess
            - runtimeBlock
          additionalProperties: false
paths:
  /api/v1/auth/callback:
    get:
      operationId: completeLogin
      summary: Complete OIDC sign-in
      tags:
        - Authentication
      parameters:
        - schema:
            type: string
          in: query
          name: code
          required: false
        - schema:
            type: string
          in: query
          name: state
          required: false
      security: []
      responses:
        "302":
          description: Redirect.
        default:
          description: Sandpi error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/login:
    get:
      operationId: startLogin
      summary: Start browser-based sign-in
      tags:
        - Authentication
      description: Starts the deployment's OIDC flow. Self-hosted built-in-admin mode
        redirects locally without an external identity provider.
      parameters:
        - schema:
            type: string
          in: query
          name: return_to
          required: false
      security: []
      responses:
        "302":
          description: Redirect.
        default:
          description: Sandpi error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: End the current browser session
      tags:
        - Authentication
      responses:
        "204":
          description: No content.
        default:
          description: Sandpi error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/me:
    get:
      operationId: getCurrentPrincipal
      summary: Get the authenticated principal
      tags:
        - Authentication
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Principal"
                required:
                  - data
                additionalProperties: false
        default:
          description: Sandpi error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/native/complete:
    post:
      operationId: completeNativeLogin
      summary: Exchange a native PKCE handoff for a WebView session
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                attemptId:
                  type: string
                code:
                  type: string
                verifier:
                  type: string
              required:
                - attemptId
                - code
                - verifier
      security: []
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      returnTo:
                        type: string
                    required:
                      - returnTo
                    additionalProperties: false
                required:
                  - data
                additionalProperties: false
        default:
          description: Sandpi error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/native/finalize:
    get:
      operationId: finalizeNativeLogin
      summary: Return completed browser sign-in to a native client
      tags:
        - Authentication
      parameters:
        - schema:
            type: string
          in: query
          name: attempt_id
          required: true
      responses:
        "302":
          description: Redirect.
        default:
          description: Sandpi error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/native/login:
    get:
      operationId: startNativeLogin
      summary: Start system-browser sign-in for a native client
      tags:
        - Authentication
      description: Creates a short-lived PKCE handoff and starts the deployment's
        browser-based sign-in flow.
      parameters:
        - schema:
            type: string
          in: query
          name: attempt_id
          required: true
      security: []
      responses:
        "302":
          description: Redirect.
        default:
          description: Sandpi error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/auth/native/prepare:
    post:
      operationId: prepareNativeLogin
      summary: Prepare system-browser sign-in for a native client
      tags:
        - Authentication
      description: Creates a short-lived PKCE handoff without retaining the client's
        verifier.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                returnTo:
                  type: string
                verifier:
                  type: string
                state:
                  type: string
              required:
                - returnTo
                - verifier
                - state
      security: []
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      authorizationUrl:
                        type: string
                      expiresAt:
                        type: string
                        format: date-time
                        pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d+)?)?(?:Z))$
                    required:
                      - authorizationUrl
                      - expiresAt
                    additionalProperties: false
                required:
                  - data
                additionalProperties: false
        default:
          description: Sandpi error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/billing/checkout:
    post:
      operationId: createBillingCheckout
      summary: Create or update a paid subscription
      tags:
        - Billing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                planId:
                  type: string
                  enum:
                    - plus
                    - pro
                    - ultra
                idempotencyKey:
                  type: string
                  minLength: 16
                  maxLength: 128
              required:
                - planId
                - idempotencyKey
              additionalProperties: false
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/SandpiCheckoutResult"
                required:
                  - data
                additionalProperties: false
        default:
          description: Sandpi error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/billing/portal:
    post:
      operationId: createBillingPortalSession
      summary: Create a customer portal session
      tags:
        - Billing
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/SandpiCustomerPortalResult"
                required:
                  - data
                additionalProperties: false
        default:
          description: Sandpi error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/billing/summary:
    get:
      operationId: getBillingSummary
      summary: Get plan, subscription and usage state
      tags:
        - Billing
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/SandpiBillingSummary"
                required:
                  - data
                additionalProperties: false
        default:
          description: Sandpi error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/billing/webhook:
    post:
      operationId: receiveStripeWebhook
      summary: Receive a signed Stripe webhook
      tags:
        - Billing
      description: Deployment integration endpoint. Application clients do not call it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      parameters:
        - schema:
            type: string
          in: header
          name: stripe-signature
          required: true
      security: []
      x-sandpi-audience: deployment
      responses:
        "204":
          description: No content.
        default:
          description: Sandpi error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/bootstrap:
    get:
      operationId: getBootstrap
      summary: Load the initial application snapshot
      tags:
        - Bootstrap
      parameters:
        - schema:
            type: string
          in: query
          name: environment
          required: false
        - schema:
            type: string
          in: query
          name: session
          required: false
        - schema:
            type: string
            enum:
              - "1"
          in: query
          name: new
          required: false
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/SandpiBootstrap"
                  meta:
                    type: object
                    properties:
                      runtime:
                        type: string
                        enum:
                          - sandbox0
                          - unconfigured
                    required:
                      - runtime
                    additionalProperties: false
                required:
                  - data
                  - meta
                additionalProperties: false
        default:
          description: Sandpi error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/environments:
    get:
      operationId: listEnvironments
      summary: List accessible Environments
      tags:
        - Environments
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Environment"
                required:
                  - data
                additionalProperties: false
        default:
          description: Sandpi error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createEnvironment
      summary: Create an Environment
      tags:
        - Environments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
              required:
                - name
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Environment"
                required:
                  - data
                additionalProperties: false
        default:
          description: Sandpi error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/environments/order:
    put:
      operationId: reorderEnvironments
      summary: Replace the Environment display order
      tags:
        - Environments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                environmentIds:
                  maxItems: 1000
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 200
              required:
                - environmentIds
              additionalProperties: false
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Environment"
                required:
                  - data
                additionalProperties: false
        default:
          description: Sandpi error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/environments/{environmentId}:
    put:
      operationId: updateEnvironment
      summary: Replace mutable Environment settings
      tags:
        - Environments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                description:
                  type: string
                  maxLength: 500
                color:
                  type: string
                  pattern: ^#[0-9a-f]{6}$
                idlePauseTimeoutSeconds:
                  type: integer
                  minimum: 0
                  maximum: 2592000
                sandboxMemoryMiB:
                  type: integer
                  minimum: 128
                  maximum: 8192
                workspaceBackup:
                  type: object
                  properties:
                    intervalSeconds:
                      type: integer
                      enum:
                        - 0
                        - 3600
                        - 21600
                        - 43200
                        - 86400
                        - 604800
                    retentionCount:
                      type: integer
                      enum:
                        - 1
                        - 3
                        - 7
                        - 14
                        - 30
                  required:
                    - intervalSeconds
                    - retentionCount
                networkPolicy:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum:
                        - allow-all
                        - block-all
                    domainExceptions:
                      maxItems: 500
                      type: array
                      items:
                        type: string
                  required:
                    - mode
                    - domainExceptions
              required:
                - name
                - description
                - color
                - idlePauseTimeoutSeconds
                - sandboxMemoryMiB
                - workspaceBackup
                - networkPolicy
      parameters:
        - schema:
            type: string
            minLength: 1
          in: path
          name: environmentId
          required: true
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Environment"
                required:
                  - data
                additionalProperties: false
        default:
          description: Sandpi error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteEnvironment
      summary: Delete an Environment
      tags:
        - Environments
      parameters:
        - schema:
            type: string
            minLength: 1
          in: path
          name: environmentId
          required: true
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                    required:
                      - id
                    additionalProperties: false
                required:
                  - data
                additionalProperties: false
        default:
          description: Sandpi error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/v1/environments/{environmentId}/egress-credentials:
    get:
      operationId: listEnvironmentEgressCredentials
      summary: List secret-free egress credential projections
      tags:
        - Egress credentials
      parameters:
        - schema:
            type: string
            minLength: 1
          in: path
          name: environmentId
          required: true
      responses:
        "200":
          description: Successful response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EnvironmentEgressCredential"
                required:
                  - data
                additionalProperties: false
        default:
          description: Sandpi error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createEnvironmentEgressCredential
      summary: Create an egress credential
      tags:
        - Egress credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  properties:
                    name:
                      type: string
                      minLength: 1
                      maxLength: 80
                    resolverKind:
                      type: string
                      enum:
                        - static_headers
                        - static_tls_client_certificate
                        - static_username_password
                        - static_ssh_private_key
                    projection:
                      oneOf:
                        - type: object
                          properties:
                            type:
                              type: string
                              enum:
                                - http_headers
                            headers:
                              minItems: 1
                              maxItems: 32
                              type: array
                              items:
                                type: object
                                properties:
                                  name:
                                    type: string
                                    minLength: 1
                                    maxLength: 128
                                    pattern: ^[!#$%&'*+\-.^_`|~0-9A-Za-z]+$
                                  valueTemplate:
                                    type: string
                                    minLength: 1
                                    maxLength: 2048
                                required:
                                  - name
                                  - valueTemplate
                          required:
                            - type
                            - headers
                        - type: object
                          properties:
                            type:
                              type: string
                              enum:
                                - placeholder_substitution
                            replacements:
                              minItems: 1
                              maxItems: 32
                              type: array
                              items:
                                type: object
                                properties:
                                  placeholder:
                                    type: string
                                    minLength: 1
                                    maxLength: 512
                                  valueTemplate:
                                    type: string
                                    minLength: 1
                                    maxLength: 2048
                                  locations:
                                    minItems: 1
                                    maxItems: 3
                                    type: array
                                    items:
                                      type: string
                                      enum:
                                        - header
                                        - query
                                        - body
                                required:
                                  - placeholder
                                  - valueTemplate
                                  - locations
                          required:
                            - type
