openapi: 3.0.3
info:
  title: Sandpi API
  version: 0.1.0
  description: The public Sandpi server contract. JSON endpoints use a data
    envelope and errors use an error envelope. Unix timestamps are seconds.
    Browser-cookie authentication is deployment-scoped; Environment Preview uses
    an isolated wildcard origin and native harness payloads remain explicit.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sandpi_session
      description: OIDC-backed deployments use the HttpOnly Sandpi session cookie.
        Built-in-admin deployments authenticate the local administrator
        implicitly unless signed out.
  schemas:
    CodexAccountRateLimits:
      type: object
      properties:
        limits:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              planType:
                type: string
                enum:
                  - free
                  - go
                  - plus
                  - pro
                  - prolite
                  - team
                  - self_serve_business_usage_based
                  - business
                  - enterprise_cbp_usage_based
                  - enterprise
                  - edu
                  - unknown
              primary:
                type: object
                properties:
                  usedPercent:
                    type: number
                  windowDurationMins:
                    type: number
                  resetsAt:
                    type: number
                    description: Unix time in seconds; fractional values preserve milliseconds.
                required:
                  - usedPercent
                additionalProperties: false
              secondary:
                type: object
                properties:
                  usedPercent:
                    type: number
                  windowDurationMins:
                    type: number
                  resetsAt:
                    type: number
                    description: Unix time in seconds; fractional values preserve milliseconds.
                required:
                  - usedPercent
                additionalProperties: false
              credits:
                type: object
                properties:
                  hasCredits:
                    type: boolean
                  unlimited:
                    type: boolean
                  balance:
                    type: string
                required:
                  - hasCredits
                  - unlimited
                additionalProperties: false
              individualLimit:
                type: object
                properties:
                  limit:
                    type: string
                  used:
                    type: string
                  remainingPercent:
                    type: number
                  resetsAt:
                    type: number
                    description: Unix time in seconds; fractional values preserve milliseconds.
                required:
                  - limit
                  - used
                  - remainingPercent
                  - resetsAt
                additionalProperties: false
              reached:
                type: boolean
            required:
              - reached
            additionalProperties: false
        resetCredits:
          type: object
          properties:
            availableCount:
              type: integer
              minimum: 0
              maximum: 9007199254740991
          required:
            - availableCount
          additionalProperties: false
        fetchedAt:
          type: number
          description: Unix time in seconds; fractional values preserve milliseconds.
      required:
        - limits
        - fetchedAt
      additionalProperties: false
    CodexAccountSummary:
      type: object
      properties:
        type:
          type: string
          enum:
            - chatgpt
            - unknown
        email:
          type: string
        planType:
          type: string
          enum:
            - free
            - go
            - plus
            - pro
            - prolite
            - team
            - self_serve_business_usage_based
            - business
            - enterprise_cbp_usage_based
            - enterprise
            - edu
            - unknown
        lastVerified:
          type: number
          description: Unix time in seconds; fractional values preserve milliseconds.
      required:
        - type
      additionalProperties: false
    CodexAgentThreads:
      type: object
      properties:
        root:
          $ref: "#/components/schemas/CodexThread"
        descendants:
          type: array
          items:
            $ref: "#/components/schemas/CodexThread"
      required:
        - root
        - descendants
      additionalProperties: false
    CodexBackgroundTerminals:
      type: object
      properties:
        terminals:
          type: array
          items:
            type: object
            properties:
              itemId:
                type: string
              processId:
                type: string
              command:
                type: string
              cwd:
                type: string
              osPid:
                nullable: true
                type: integer
                minimum: -9007199254740991
                maximum: 9007199254740991
              cpuPercent:
                nullable: true
                type: number
              rssKb:
                nullable: true
                type: number
            required:
              - itemId
              - processId
              - command
              - cwd
              - osPid
              - cpuPercent
              - rssKb
            additionalProperties: false
      required:
        - terminals
      additionalProperties: false
    CodexComposerUpload:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        path:
          type: string
        kind:
          type: string
          enum:
            - file
            - localImage
        source:
          type: string
          enum:
            - upload
        mimeType:
          type: string
        sizeBytes:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - id
        - name
        - path
        - kind
        - source
      additionalProperties: false
    CodexDeviceAuthFlow:
      type: object
      properties:
        id:
          type: string
        environmentId:
          type: string
        status:
          type: string
          enum:
            - provisioning
            - starting
            - awaiting_user
            - completed
            - failed
            - cancelled
            - expired
        verificationUrl:
          type: string
          format: uri
        userCode:
          type: string
        error:
          type: string
        expiresAt:
          type: number
          description: Unix time in seconds; fractional values preserve milliseconds.
        createdAt:
          type: number
          description: Unix time in seconds; fractional values preserve milliseconds.
        updatedAt:
          type: number
          description: Unix time in seconds; fractional values preserve milliseconds.
      required:
        - id
        - environmentId
        - status
        - expiresAt
        - createdAt
        - updatedAt
      additionalProperties: false
    CodexHooksInventory:
      type: object
      properties:
        cwd:
          type: string
        hooks:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              eventName:
                type: string
              handlerType:
                type: string
              isManaged:
                type: boolean
              matcher:
                nullable: true
                type: string
              command:
                nullable: true
                type: string
              timeoutSec:
                type: number
              statusMessage:
                nullable: true
                type: string
              sourcePath:
                type: string
              source:
                type: string
              pluginId:
                nullable: true
                type: string
              displayOrder:
                type: number
              enabled:
                type: boolean
              currentHash:
                type: string
              trustStatus:
                type: string
                enum:
                  - trusted
                  - untrusted
                  - modified
                  - managed
            required:
              - key
              - eventName
              - handlerType
              - isManaged
              - matcher
              - command
              - timeoutSec
              - statusMessage
              - sourcePath
              - source
              - pluginId
              - displayOrder
              - enabled
              - currentHash
              - trustStatus
            additionalProperties: false
        warnings:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required:
              - message
            additionalProperties: false
      required:
        - cwd
        - hooks
        - warnings
        - errors
      additionalProperties: false
    CodexMcpInventory:
      type: object
      properties:
        servers:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              transport:
                type: string
                enum:
                  - stdio
                  - streamable-http
              command:
                type: string
              args:
                type: array
                items:
                  type: string
              url:
                type: string
              enabled:
                type: boolean
              managed:
                type: boolean
              runtimeStatus:
                type: string
                enum:
                  - connected
                  - authentication-required
                  - unavailable
                  - disabled
              serverTitle:
                type: string
              authStatus:
                type: string
              tools:
                type: array
                items:
                  type: string
              resources:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    title:
                      type: string
                    uri:
                      type: string
                  required:
                    - name
                    - uri
                  additionalProperties: false
              resourceTemplates:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    title:
                      type: string
                    uriTemplate:
                      type: string
                  required:
                    - name
                    - uriTemplate
                  additionalProperties: false
              toolCount:
                type: integer
                minimum: 0
                maximum: 9007199254740991
              resourceCount:
                type: integer
                minimum: 0
                maximum: 9007199254740991
            required:
              - name
              - transport
              - args
              - enabled
              - managed
              - runtimeStatus
              - tools
              - resources
              - resourceTemplates
              - toolCount
              - resourceCount
            additionalProperties: false
      required:
        - servers
      additionalProperties: false
    CodexMcpOAuthLogin:
      type: object
      properties:
        name:
          type: string
        authorizationUrl:
          type: string
          format: uri
        expiresAt:
          type: number
          description: Unix time in seconds; fractional values preserve milliseconds.
      required:
        - name
        - authorizationUrl
        - expiresAt
      additionalProperties: false
    CodexMemoriesSettings:
      type: object
      properties:
        featureEnabled:
          type: boolean
        useMemories:
          type: boolean
        generateMemories:
          type: boolean
      required:
        - featureEnabled
        - useMemories
        - generateMemories
      additionalProperties: false
    CodexNativeSnapshot:
      type: object
      properties:
        protocol:
          type: string
          enum:
            - codex-app-server
        nativeSessionId:
          type: string
        historyRevision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        modelId:
          type: string
        reasoningEffort:
          type: string
        sessionStatus:
          type: string
          enum:
            - running
            - waiting
            - paused
            - completed
            - failed
        thread:
          $ref: "#/components/schemas/CodexThread"
        tokenUsage:
          nullable: true
          type: object
          additionalProperties: {}
        activity:
          type: object
          additionalProperties: {}
        forkableTurnIds:
          type: array
          items:
            type: string
      required:
        - protocol
        - nativeSessionId
        - historyRevision
        - modelId
        - sessionStatus
        - thread
        - activity
        - forkableTurnIds
      additionalProperties: {}
    CodexPersonalitySettings:
      type: object
      properties:
        personality:
          type: string
          enum:
            - friendly
            - pragmatic
            - none
        supported:
          type: boolean
      required:
        - personality
        - supported
      additionalProperties: false
    CodexRateLimitResetResult:
      type: object
      properties:
        outcome:
          type: string
          enum:
            - reset
            - nothingToReset
            - noCredit
            - alreadyRedeemed
      required:
        - outcome
      additionalProperties: false
    CodexSessionGoal:
      type: object
      properties:
        goal:
          nullable: true
          type: object
          properties:
            objective:
              type: string
            status:
              type: string
            tokenBudget:
              nullable: true
              type: number
            tokensUsed:
              type: number
            timeUsedSeconds:
              type: number
          required:
            - objective
            - status
            - tokenBudget
            - tokensUsed
            - timeUsedSeconds
          additionalProperties: false
      required:
        - goal
      additionalProperties: false
    CodexSkillsInventory:
      type: object
      properties:
        cwd:
          type: string
        skills:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              displayName:
                type: string
              description:
                type: string
              shortDescription:
                type: string
              path:
                type: string
              scope:
                type: string
                enum:
                  - user
                  - repo
                  - system
                  - admin
              enabled:
                type: boolean
              dependencies:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    value:
                      type: string
                    description:
                      type: string
                    transport:
                      type: string
                    command:
                      type: string
                    url:
                      type: string
                  required:
                    - type
                    - value
                  additionalProperties: false
            required:
              - name
              - description
              - path
              - scope
              - enabled
              - dependencies
            additionalProperties: false
        errors:
          type: array
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
            required:
              - path
              - message
            additionalProperties: false
      required:
        - cwd
        - skills
        - errors
      additionalProperties: false
    CodexThread:
      type: object
      properties:
        id:
          type: string
        sessionId:
          type: string
        forkedFromId:
          nullable: true
          type: string
        parentThreadId:
          nullable: true
          type: string
        preview:
          type: string
        ephemeral:
          type: boolean
        modelProvider:
          type: string
        path:
          nullable: true
          type: string
        cwd:
          type: string
        source: {}
        canAcceptDirectInput:
          nullable: true
          type: boolean
        agentNickname:
          nullable: true
          type: string
        agentRole:
          nullable: true
          type: string
        name:
          nullable: true
          type: string
        createdAt:
          type: number
        updatedAt:
          type: number
        status:
          anyOf:
            - type: object
              properties:
                type:
                  type: string
                  enum:
                    - notLoaded
                    - idle
                    - systemError
              required:
                - type
              additionalProperties: false
            - type: object
              properties:
                type:
                  type: string
                  enum:
                    - active
                activeFlags:
                  type: array
                  items:
                    type: string
                    enum:
                      - waitingOnApproval
                      - waitingOnUserInput
              required:
                - type
                - activeFlags
              additionalProperties: false
        turns:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              items:
                type: array
                items: {}
              itemsView:
                type: string
                enum:
                  - notLoaded
                  - summary
                  - full
              status:
                type: string
                enum:
                  - completed
                  - interrupted
                  - failed
                  - inProgress
              error:
                nullable: true
                type: object
                properties:
                  message:
                    type: string
                  codexErrorInfo:
                    nullable: true
                  additionalDetails:
                    nullable: true
                    type: string
                required:
                  - message
                  - codexErrorInfo
                  - additionalDetails
                additionalProperties: false
              startedAt:
                nullable: true
                type: number
              completedAt:
                nullable: true
                type: number
              durationMs:
                nullable: true
                type: number
            required:
              - id
              - items
              - itemsView
              - status
              - error
              - startedAt
              - completedAt
              - durationMs
            additionalProperties: false
      required:
        - id
        - status
        - turns
      additionalProperties: {}
    CodexTokenUsage:
      type: object
      properties:
        summary:
          type: object
          properties:
            lifetimeTokens:
              nullable: true
              type: number
            peakDailyTokens:
              nullable: true
              type: number
            longestRunningTurnSec:
              nullable: true
              type: number
            currentStreakDays:
              nullable: true
              type: number
            longestStreakDays:
              nullable: true
              type: number
          required:
            - lifetimeTokens
            - peakDailyTokens
            - longestRunningTurnSec
            - currentStreakDays
            - longestStreakDays
          additionalProperties: false
        dailyUsageBuckets:
          type: array
          items:
            type: object
            properties:
              startDate:
                type: string
              tokens:
                type: number
            required:
              - startDate
              - tokens
            additionalProperties: false
      required:
        - summary
        - dailyUsageBuckets
      additionalProperties: false
    CodingSession:
      type: object
      properties:
        id:
          type: string
        environmentId:
          type: string
        owner:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/SandpiUser"
        title:
          type: string
        status:
          type: string
          enum:
            - running
            - waiting
            - paused
            - completed
            - failed
        unread:
          type: boolean
        pinned:
          type: boolean
        completed:
          type: boolean
          description: User-managed completion state. A later native Turn automatically
            resets it to false.
        archived:
          type: boolean
        harness:
          type: string
          enum:
            - codex
            - claude-code
            - opencode
            - pi
        harnessLabel:
          type: string
        harnessState:
          anyOf:
            - type: object
              properties:
                protocol:
                  type: string
                  enum:
                    - codex-app-server
                threadId:
                  type: string
                modelId:
                  type: string
                reasoningEffort:
                  type: string
                harnessVersion:
                  type: string
                protocolVersion:
                  type: string
                  enum:
                    - v2
                historyRevision:
                  type: integer
                  minimum: 0
                  maximum: 9007199254740991
              required:
                - protocol
                - threadId
                - modelId
                - harnessVersion
                - protocolVersion
                - historyRevision
              additionalProperties: false
            - type: object
              additionalProperties: {}
        createdAt:
          type: number
          description: Unix time in seconds; fractional values preserve milliseconds.
        updatedAt:
          type: number
          description: Unix time in seconds; fractional values preserve milliseconds.
        environmentRevision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        origin:
          type: object
          properties:
            kind:
              type: string
              enum:
                - environment
                - session
                - turn
            label:
              type: string
            sourceSessionId:
              type: string
            sourceNativeItemId:
              type: string
          required:
            - kind
            - label
          additionalProperties: false
      required:
        - id
        - environmentId
        - owner
        - title
        - status
        - unread
        - pinned
        - completed
        - archived
        - harness
        - harnessLabel
        - harnessState
        - createdAt
        - updatedAt
        - environmentRevision
      additionalProperties: false
    Environment:
      type: object
      properties:
        id:
          type: string
        ownerId:
          type: string
        idlePauseTimeoutSeconds:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        sandboxMemoryMiB:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 9007199254740991
        workspaceBackup:
          type: object
          properties:
            intervalSeconds:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            retentionCount:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            nextBackupAt:
              type: number
              description: Unix time in seconds; fractional values preserve milliseconds.
            lastBackupAt:
              type: number
              description: Unix time in seconds; fractional values preserve milliseconds.
            lastError:
              type: string
          required:
            - intervalSeconds
            - retentionCount
          additionalProperties: false
        name:
          type: string
        description:
          type: string
        color:
          type: string
        status:
          type: string
          enum:
            - ready
            - updating
            - error
        revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        templateId:
          type: string
        rootfsSnapshotId:
          type: string
        workspaceVolumeId:
          type: string
        sandboxId:
          type: string
        sandboxState:
          type: string
          enum:
            - pending
            - provisioning
            - running
            - paused
            - terminated
            - failed
        supervisorSessionId:
          type: string
        workspaceRoot:
          type: string
          enum:
            - /workspace
        provisioningError:
          type: string
        credentialRevision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        codingAgent:
          type: object
          properties:
            harness:
              type: string
              enum:
                - codex
                - claude-code
                - opencode
                - pi
            label:
              type: string
            status:
              type: string
              enum:
                - connected
                - not-connected
                - coming-soon
            account:
              type: string
            lastVerified:
              type: number
              description: Unix time in seconds; fractional values preserve milliseconds.
          required:
            - harness
            - label
            - status
          additionalProperties: false
        networkPolicy:
          type: object
          properties:
            mode:
              type: string
              enum:
                - allow-all
                - block-all
            domainExceptions:
              type: array
              items:
                type: string
          required:
            - mode
            - domainExceptions
          additionalProperties: false
      required:
        - id
        - ownerId
        - idlePauseTimeoutSeconds
        - sandboxMemoryMiB
        - workspaceBackup
        - name
        - description
        - color
        - status
        - revision
        - templateId
        - rootfsSnapshotId
        - workspaceVolumeId
        - sandboxId
        - sandboxState
        - supervisorSessionId
        - workspaceRoot
        - credentialRevision
        - codingAgent
        - networkPolicy
      additionalProperties: false
    EnvironmentCloudState:
      type: object
      properties:
        id:
          type: string
        ownerId:
          type: string
        idlePauseTimeoutSeconds:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        sandboxMemoryMiB:
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 9007199254740991
        workspaceBackup:
          type: object
          properties:
            intervalSeconds:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            retentionCount:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            nextBackupAt:
              type: number
              description: Unix time in seconds; fractional values preserve milliseconds.
            lastBackupAt:
              type: number
              description: Unix time in seconds; fractional values preserve milliseconds.
            lastError:
              type: string
          required:
            - intervalSeconds
            - retentionCount
          additionalProperties: false
        name:
          type: string
        description:
          type: string
        color:
          type: string
        status:
          type: string
          enum:
            - ready
            - updating
            - error
        revision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        templateId:
          type: string
        rootfsSnapshotId:
          type: string
        workspaceVolumeId:
          type: string
        sandboxId:
          type: string
        supervisorSessionId:
          type: string
        workspaceRoot:
          type: string
          enum:
            - /workspace
        provisioningError:
          type: string
        credentialRevision:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        codingAgent:
          type: object
          properties:
            harness:
              type: string
              enum:
                - codex
                - claude-code
                - opencode
                - pi
            label:
              type: string
            status:
              type: string
              enum:
                - connected
                - not-connected
                - coming-soon
            account:
              type: string
            lastVerified:
              type: number
              description: Unix time in seconds; fractional values preserve milliseconds.
          required:
            - harness
            - label
            - status
          additionalProperties: false
        networkPolicy:
          type: object
          properties:
            mode:
              type: string
              enum:
                - allow-all
                - block-all
            domainExceptions:
              type: array
              items:
                type: string
          required:
            - mode
            - domainExceptions
          additionalProperties: false
      required:
        - id
        - ownerId
        - idlePauseTimeoutSeconds
        - sandboxMemoryMiB
        - workspaceBackup
        - name
        - description
        - color
        - status
        - revision
        - templateId
        - rootfsSnapshotId
        - workspaceVolumeId
        - sandboxId
        - supervisorSessionId
        - workspaceRoot
        - credentialRevision
        - codingAgent
        - networkPolicy
      additionalProperties: false
    EnvironmentEgressCredential:
      type: object
      properties:
        id:
          type: string
        environmentId:
          type: string
        name:
          type: string
        resolverKind:
          type: string
          enum:
            - static_headers
            - static_tls_client_certificate
            - static_username_password
            - static_ssh_private_key
        projection:
          oneOf:
            - type: object
              properties:
                type:
                  type: string
                  enum:
                    - http_headers
                headers:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      valueTemplate:
