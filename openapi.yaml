  - name: Health
    description: Deployment health probes.
  - name: Authentication
    description: Browser-cookie authentication and OIDC redirects.
  - name: Bootstrap
    description: Initial cross-client application state.
  - name: Billing
    description: Optional deployment billing state.
  - name: Environments
    description: Shared Sandpi workspaces and runtimes.
  - name: Egress credentials
    description: Environment-scoped secret injection without secret readback.
  - name: Workspace backups
    description: Persistent Workspace snapshots and restore.
  - name: Schedules
    description: Durable Environment automations.
  - name: Codex
    description: Environment-scoped native Codex capabilities.
  - name: Sessions
    description: Product Sessions backed by harness-native history.
  - name: Workspace
    description: Harness-neutral Workspace file access.
  - name: Workspace IDE
    description: Cross-client editor snapshots, mutations and invalidations.
  - name: Preview
    description: Isolated access to HTTP services on Environment loopback.
  - name: Metrics
    description: Environment runtime metrics.
  - name: Terminal
    description: The shared Environment terminal.
  - name: Preferences
    description: Authenticated viewer preferences.
externalDocs:
  description: Sandpi source and architecture documentation
  url: https://github.com/sandbox0-ai/sandpi
