                  type: string
                  minLength: 1
                  maxLength: 100
                localImages:
                  default: []
                  maxItems: 20
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 512
                      path:
                        type: string
