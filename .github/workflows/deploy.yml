name: Validate and deploy Sandpi

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sandpi-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: npm ci
      - run: npm test
      - run: npm run openapi:check
      - run: npm run typecheck
      - run: npm run build
      - run: go test ./...
        working-directory: cli
      - run: go vet ./...
        working-directory: cli
      - run: go build -trimpath -o "${RUNNER_TEMP}/sandpi" ./cmd/sandpi
        working-directory: cli
      - uses: azure/setup-kubectl@v5.1.0
        with:
          version: v1.35.1
      - name: Validate Kubernetes manifests
        run: |
          set -euo pipefail
          if [[ "$(grep -RFl 'ghcr.io/sandbox0-ai/sandpi:main' deploy/kubernetes/app | wc -l)" -ne 1 ]]; then
            echo "The Kubernetes image placeholder must occur exactly once."
            exit 1
          fi
          kubectl kustomize deploy/kubernetes/app >/dev/null

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sandpi.ai
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/sandbox0-ai/sandpi:${{ github.sha }}
      SANDBOX0_API_HOST: ${{ vars.SANDBOX0_API_HOST }}
      SANDBOX0_API_KEY: ${{ secrets.SANDBOX0_API_KEY }}
      SANDPI_AUTH_MODE: ${{ vars.SANDPI_AUTH_MODE }}
      SANDPI_BILLING_MODE: ${{ vars.SANDPI_BILLING_MODE }}
      SANDPI_COOKIE_SECRET: ${{ secrets.SANDPI_COOKIE_SECRET }}
      SANDPI_INGRESS_IP: ${{ vars.SANDPI_INGRESS_IP }}
      SANDPI_KUBE_CONFIG: ${{ secrets.SANDPI_KUBE_CONFIG }}
      SANDPI_OIDC_CLIENT_ID: ${{ vars.SANDPI_OIDC_CLIENT_ID }}
      SANDPI_OIDC_CLIENT_SECRET: ${{ secrets.SANDPI_OIDC_CLIENT_SECRET }}
      SANDPI_OIDC_ISSUER: ${{ vars.SANDPI_OIDC_ISSUER }}
      SANDPI_OIDC_SCOPES: ${{ vars.SANDPI_OIDC_SCOPES }}
      SANDPI_OIDC_TOKEN_ENDPOINT_AUTH_METHOD: ${{ vars.SANDPI_OIDC_TOKEN_ENDPOINT_AUTH_METHOD }}
      SANDPI_POSTGRES_PASSWORD: ${{ secrets.SANDPI_POSTGRES_PASSWORD }}
      SANDPI_PUBLIC_URL: ${{ vars.SANDPI_PUBLIC_URL }}
      NEXT_PUBLIC_CLARITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_CLARITY_PROJECT_ID }}
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ vars.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
      SANDPI_SECRET_KEY: ${{ secrets.SANDPI_SECRET_KEY }}
      SANDPI_STRIPE_PLUS_PRICE_ID: ${{ vars.SANDPI_STRIPE_PLUS_PRICE_ID }}
      SANDPI_STRIPE_PRO_PRICE_ID: ${{ vars.SANDPI_STRIPE_PRO_PRICE_ID }}
      SANDPI_STRIPE_ULTRA_PRICE_ID: ${{ vars.SANDPI_STRIPE_ULTRA_PRICE_ID }}
      SANDPI_STRIPE_SECRET_KEY: ${{ secrets.SANDPI_STRIPE_SECRET_KEY }}
      SANDPI_STRIPE_WEBHOOK_SECRET: ${{ secrets.SANDPI_STRIPE_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate deployment inputs
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const required = [
            "SANDBOX0_API_HOST",
            "SANDBOX0_API_KEY",
            "SANDPI_BILLING_MODE",
            "SANDPI_COOKIE_SECRET",
            "SANDPI_INGRESS_IP",
            "SANDPI_KUBE_CONFIG",
            "SANDPI_OIDC_CLIENT_ID",
            "SANDPI_OIDC_CLIENT_SECRET",
            "SANDPI_OIDC_ISSUER",
            "SANDPI_OIDC_SCOPES",
            "SANDPI_OIDC_TOKEN_ENDPOINT_AUTH_METHOD",
            "SANDPI_POSTGRES_PASSWORD",
            "SANDPI_PUBLIC_URL",
            "SANDPI_SECRET_KEY",
            "SANDPI_STRIPE_PLUS_PRICE_ID",
            "SANDPI_STRIPE_PRO_PRICE_ID",
            "SANDPI_STRIPE_ULTRA_PRICE_ID",
            "SANDPI_STRIPE_SECRET_KEY",
            "SANDPI_STRIPE_WEBHOOK_SECRET",
          ];
          for (const name of required) {
            if (!process.env[name]) throw new Error(`${name} is required.`);
          }
          if (process.env.SANDPI_AUTH_MODE !== "oidc") {
            throw new Error("The production deployment requires SANDPI_AUTH_MODE=oidc.");
          }
          if (process.env.SANDPI_BILLING_MODE !== "stripe") {
            throw new Error("The production deployment requires SANDPI_BILLING_MODE=stripe.");
          }
          for (const name of [
            "SANDBOX0_API_HOST",
            "SANDPI_OIDC_ISSUER",
            "SANDPI_PUBLIC_URL",
          ]) {
            const value = new URL(process.env[name]);
            if (value.protocol !== "https:") {
              throw new Error(`${name} must use HTTPS.`);
            }
          }
          if (new URL(process.env.SANDPI_PUBLIC_URL).origin !== "https://sandpi.ai") {
            throw new Error("SANDPI_PUBLIC_URL must be https://sandpi.ai.");
          }
          if (!process.env.SANDPI_OIDC_SCOPES.split(/\s+/).includes("openid")) {
            throw new Error("SANDPI_OIDC_SCOPES must include openid.");
          }
          if (!/^[a-f0-9]{32,}$/i.test(process.env.SANDPI_POSTGRES_PASSWORD)) {
            throw new Error("SANDPI_POSTGRES_PASSWORD must be a URL-safe hexadecimal secret.");
          }
          if (!/^(?:\d{1,3}\.){3}\d{1,3}$/.test(process.env.SANDPI_INGRESS_IP)) {
            throw new Error("SANDPI_INGRESS_IP must be an IPv4 address.");
          }
          for (const name of [
            "SANDPI_STRIPE_PLUS_PRICE_ID",
            "SANDPI_STRIPE_PRO_PRICE_ID",
            "SANDPI_STRIPE_ULTRA_PRICE_ID",
          ]) {
            if (!/^price_[A-Za-z0-9]+$/.test(process.env[name])) {
              throw new Error(`${name} must be a Stripe Price id.`);
            }
          }
          const priceIds = [
            process.env.SANDPI_STRIPE_PLUS_PRICE_ID,
            process.env.SANDPI_STRIPE_PRO_PRICE_ID,
            process.env.SANDPI_STRIPE_ULTRA_PRICE_ID,
          ];
          if (new Set(priceIds).size !== priceIds.length) {
            throw new Error("Each Sandpi plan must use a distinct Stripe Price id.");
          }
          if (!/^(?:sk|rk)_(?:test|live)_/.test(process.env.SANDPI_STRIPE_SECRET_KEY)) {
            throw new Error("SANDPI_STRIPE_SECRET_KEY must be a Stripe secret or restricted key.");
          }
          if (!/^whsec_/.test(process.env.SANDPI_STRIPE_WEBHOOK_SECRET)) {
            throw new Error("SANDPI_STRIPE_WEBHOOK_SECRET must be a Stripe webhook signing secret.");
          }
          NODE
      - name: Build and publish image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker build \
            --pull \
            --build-arg "NEXT_PUBLIC_CLARITY_PROJECT_ID=${NEXT_PUBLIC_CLARITY_PROJECT_ID}" \
            --build-arg "NEXT_PUBLIC_GA_MEASUREMENT_ID=${NEXT_PUBLIC_GA_MEASUREMENT_ID}" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag "${IMAGE}" \
            .
          docker push "${IMAGE}"
      - name: Set up kubectl
        uses: azure/setup-kubectl@v5.1.0
        with:
          version: v1.35.1
      - name: Configure namespace-scoped kubeconfig
        run: |
          set -euo pipefail
          kubeconfig_path="${RUNNER_TEMP}/sandpi-kubeconfig"
          printf '%s' "${SANDPI_KUBE_CONFIG}" > "${kubeconfig_path}"
          chmod 600 "${kubeconfig_path}"
          echo "KUBECONFIG=${kubeconfig_path}" >> "${GITHUB_ENV}"
          export KUBECONFIG="${kubeconfig_path}"
          kubectl auth can-i patch secret/sandpi-runtime --namespace sandpi | grep -Fx yes
          kubectl auth can-i patch secret/sandpi-postgres --namespace sandpi | grep -Fx yes
          kubectl auth can-i create certificates.cert-manager.io --namespace sandpi | grep -Fx yes
          kubectl auth can-i create issuers.cert-manager.io --namespace sandpi | grep -Fx yes
          if kubectl auth can-i create namespaces --quiet; then
            echo "The Sandpi deployer must not have cluster-scoped namespace permissions."
            exit 1
          fi
      - name: Update runtime secrets
        env:
          NODE_ENV: production
          POSTGRES_DB: sandpi
          POSTGRES_USER: sandpi
          SANDPI_HOST: 0.0.0.0
          SANDPI_LOG_LEVEL: info
          SANDPI_PORT: "3000"
        run: |
          set -euo pipefail
          export POSTGRES_PASSWORD="${SANDPI_POSTGRES_PASSWORD}"
          export DATABASE_URL="postgresql://sandpi:${SANDPI_POSTGRES_PASSWORD}@postgres:5432/sandpi"

          render_secret_patch() {
            node --input-type=module - "$@" <<'NODE'
          const names = process.argv.slice(2);
          const data = Object.fromEntries(
            names.map((name) => {
              const value = process.env[name];
              if (value === undefined) throw new Error(`${name} is not set.`);
              return [name, Buffer.from(value).toString("base64")];
            }),
          );
          process.stdout.write(JSON.stringify({ data }));
          NODE
          }

          render_secret_patch \
            POSTGRES_DB \
            POSTGRES_PASSWORD \
            POSTGRES_USER |
            kubectl --namespace sandpi patch secret sandpi-postgres \
              --type merge \
              --patch-file /dev/stdin

          render_secret_patch \
            DATABASE_URL \
            NODE_ENV \
            SANDBOX0_API_HOST \
            SANDBOX0_API_KEY \
            SANDPI_AUTH_MODE \
            SANDPI_BILLING_MODE \
            SANDPI_COOKIE_SECRET \
            SANDPI_HOST \
            SANDPI_LOG_LEVEL \
            SANDPI_OIDC_CLIENT_ID \
            SANDPI_OIDC_CLIENT_SECRET \
            SANDPI_OIDC_ISSUER \
            SANDPI_OIDC_SCOPES \
            SANDPI_OIDC_TOKEN_ENDPOINT_AUTH_METHOD \
            SANDPI_PORT \
            SANDPI_PUBLIC_URL \
            SANDPI_SECRET_KEY \
            SANDPI_STRIPE_PLUS_PRICE_ID \
            SANDPI_STRIPE_PRO_PRICE_ID \
            SANDPI_STRIPE_ULTRA_PRICE_ID \
            SANDPI_STRIPE_SECRET_KEY \
            SANDPI_STRIPE_WEBHOOK_SECRET |
            kubectl --namespace sandpi patch secret sandpi-runtime \
              --type merge \
              --patch-file /dev/stdin
      - name: Deploy immutable image
        run: |
          set -euo pipefail
          kubectl kustomize deploy/kubernetes/app |
            sed "s|ghcr.io/sandbox0-ai/sandpi:main|${IMAGE}|" |
            kubectl apply -f -

          if ! kubectl --namespace sandpi rollout status statefulset/postgres --timeout=5m; then
            kubectl --namespace sandpi get pods,statefulsets -o wide
            kubectl --namespace sandpi logs statefulset/postgres --tail=200 || true
            exit 1
          fi
          if ! kubectl --namespace sandpi rollout status deployment/sandpi --timeout=10m; then
            kubectl --namespace sandpi get pods,deployments,replicasets -o wide
            kubectl --namespace sandpi logs deployment/sandpi --all-containers --tail=200 || true
            exit 1
          fi
          if ! kubectl --namespace sandpi wait \
            --for=condition=Ready \
            certificate/sandpi \
            --timeout=8m; then
            kubectl --namespace sandpi describe certificate/sandpi || true
            kubectl --namespace sandpi get certificaterequests.cert-manager.io -o wide || true
            kubectl --namespace sandpi get orders.acme.cert-manager.io -o wide || true
            kubectl --namespace sandpi get challenges.acme.cert-manager.io -o wide || true
            exit 1
          fi

          deployed_image="$(
            kubectl --namespace sandpi get deployment sandpi \
              -o jsonpath='{.spec.template.spec.containers[?(@.name=="sandpi")].image}'
          )"
          test "${deployed_image}" = "${IMAGE}"
      - name: Verify ingress health
        run: |
          set -euo pipefail
          curl \
            --fail \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            --show-error \
            --silent \
            --resolve "sandpi.ai:443:${SANDPI_INGRESS_IP}" \
            https://sandpi.ai/health/ready |
            grep -F '"status":"ready"'

          redirect_location="$(
            curl \
              --output /dev/null \
              --show-error \
              --silent \
              --write-out '%{redirect_url}' \
              --resolve "sandpi.ai:80:${SANDPI_INGRESS_IP}" \
              http://sandpi.ai/health/ready
          )"
          test "${redirect_location}" = "https://sandpi.ai/health/ready"
      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
